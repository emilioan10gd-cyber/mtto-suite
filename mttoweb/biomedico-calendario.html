<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Biomédico · Calendario</title>
  <link rel="stylesheet" href="vendors/typicons.font/font/typicons.css">
  <link rel="stylesheet" href="vendors/css/vendor.bundle.base.css">
  <link rel="stylesheet" href="css/vertical-layout-light/style.css">
  <link rel="stylesheet" href="css/mtto-custom.css?v=14">
  <link rel="shortcut icon" href="images/favicon.png" />
</head>
<body>
  <div class="container-scroller">
    <!-- ============================== Navbar ============================== -->
    <div id="navbarInyectado"></div>
    <!-- ============================== /Navbar ============================== -->
    <div class="container-fluid page-body-wrapper">
      <!-- ============================== Sidebar ============================== -->
      <div id="sidebarInyectado"></div>
      <!-- ============================== /Sidebar ============================== -->
      <div class="main-panel">
        <div class="content-wrapper">          <div class="row">
            <div class="col-12">
              <h3 class="mb-0 font-weight-bold">Calendario de mantenimiento — Biomédico</h3>
              <p id="estadoCarga">Cargando datos...</p>
            </div>
          </div>

          <div class="row mt-3">
            <div class="col-12 grid-margin">
              <div class="card"><div class="card-body">
                <div class="d-flex flex-wrap align-items-center" style="gap:10px;">
                  <button type="button" class="btn btn-outline-secondary" id="btnMesAnterior"><i class="typcn typcn-arrow-left"></i></button>
                  <h4 class="mb-0" id="tituloMes" style="min-width:180px;"></h4>
                  <button type="button" class="btn btn-outline-secondary" id="btnMesSiguiente"><i class="typcn typcn-arrow-right"></i></button>
                  <button type="button" class="btn btn-outline-secondary" id="btnHoy">Hoy</button>
                  <div class="flex-grow-1"></div>
                  <button type="button" class="btn btn-primary" id="btnProgramar"><i class="typcn typcn-plus"></i> Programar mantenimiento</button>
                </div>
              </div></div>
            </div>
          </div>

          <div class="row">
            <div class="col-12 grid-margin stretch-card">
              <div class="card"><div class="card-body">
                <div id="grillaCalendario" class="calendario-grilla"></div>
              </div></div>
            </div>
          </div>

          <div class="modal fade" id="modalDia" tabindex="-1" role="dialog">
            <div class="modal-dialog modal-lg" role="document">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="modalDiaTitulo">Mantenimientos del día</h5>
                  <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                  <table class="table table-sm">
                    <thead><tr><th>Equipo</th><th>Tipo</th><th>Estado</th><th>Técnico</th><th></th></tr></thead>
                    <tbody id="tablaDia"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <div class="modal fade" id="modalProgramar" tabindex="-1" role="dialog">
            <div class="modal-dialog" role="document">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title">Programar mantenimiento</h5>
                  <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                  <div class="alert alert-danger d-none" id="errorProgramar"></div>
                  <div class="form-group">
                    <label>Equipo *</label>
                    <select class="form-control" id="pEquipo"></select>
                  </div>
                  <div class="form-row">
                    <div class="form-group col-md-6">
                      <label>Tipo *</label>
                      <select class="form-control" id="pTipo">
                        <option value="Preventivo">Preventivo</option>
                        <option value="Correctivo">Correctivo</option>
                      </select>
                    </div>
                    <div class="form-group col-md-6">
                      <label>Fecha programada *</label>
                      <input type="date" class="form-control" id="pFecha" required>
                    </div>
                  </div>
                  <div class="form-row">
                    <div class="form-group col-md-6">
                      <label>Técnico responsable</label>
                      <input type="text" class="form-control" id="pTecnico">
                    </div>
                    <div class="form-group col-md-6">
                      <label>Proveedor</label>
                      <input type="text" class="form-control" id="pProveedor">
                    </div>
                  </div>
                  <div class="form-group">
                    <label>Frecuencia (meses, opcional — para preventivos recurrentes)</label>
                    <input type="number" class="form-control" id="pFrecuencia" min="1">
                  </div>
                  <div class="form-group">
                    <label>Descripción</label>
                    <textarea class="form-control" id="pDescripcion" rows="2"></textarea>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                  <button type="button" class="btn btn-primary" id="btnGuardarProgramacion">Programar</button>
                </div>
              </div>
            </div>
          </div>

          <style>
            .calendario-grilla { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
            .cal-encabezado { font-weight: 600; text-align: center; padding: 6px 0; color: #898781; font-size: 12px; }
            .cal-dia { min-height: 90px; border: 1px solid #e6e8ec; border-radius: 4px; padding: 4px; font-size: 12px; cursor: pointer; }
            .cal-dia:hover { background: #f4f5f7; }
            .cal-dia.fuera-mes { opacity: 0.35; }
            .cal-dia .num { font-weight: 600; margin-bottom: 3px; }
            .cal-dia .item { border-radius: 3px; padding: 1px 4px; margin-bottom: 2px; font-size: 10.5px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .cal-dia .item.preventivo { background: #2a78d6; }
            .cal-dia .item.correctivo { background: #eb6834; }
            .cal-dia .item.vencido { background: #d64545; }
          </style>

        </div>
        <footer class="footer">
          <div class="d-sm-flex justify-content-center justify-content-sm-between">
            <span class="text-center text-sm-left d-block d-sm-inline-block">Mantenimiento — Panel interno</span>
          </div>
        </footer>
      </div>
    </div>
  </div>
  <script src="vendors/js/vendor.bundle.base.js"></script>
  <script src="js/off-canvas.js"></script>
  <script src="js/hoverable-collapse.js"></script>
  <script src="js/template.js"></script>
  <script src="js/mtto-config.js?v=14"></script>
  <script src="js/layout.js?v=2"></script>
  <script>Layout.inyectar();</script>

  <script src="js/auth.js?v=14"></script>
  <script>Auth.exigirSesion("biomedico");</script>
  <script src="js/biomedico-api.js?v=1"></script>
  <script src="js/biomedico-calendario.js?v=1"></script>
</body>
</html>
