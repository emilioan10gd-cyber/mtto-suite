<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>MTTO · Catálogos</title>
  <link rel="stylesheet" href="vendors/typicons.font/font/typicons.css">
  <link rel="stylesheet" href="vendors/css/vendor.bundle.base.css">
  <link rel="stylesheet" href="css/vertical-layout-light/style.css">
  <link rel="stylesheet" href="css/mtto-custom.css">
  <link rel="shortcut icon" href="images/favicon.png" />
</head>
<body>
  <div class="container-scroller">
    <!-- ============================== Navbar ============================== -->
    <div id="navbarInyectado"></div>
    <!-- ============================== /Navbar ============================== -->
    <div class="container-fluid page-body-wrapper">
      <!-- ============================== Sidebar ============================== -->
      <div id="sidebarInyectado"></div>
      <!-- ============================== /Sidebar ============================== -->
      <div class="main-panel">
        <div class="content-wrapper">
          <div class="row">
            <div class="col-12">
              <h3 class="mb-0 font-weight-bold">Catálogos</h3>
              <p class="text-muted">Categorías, almacenes, proveedores y unidades de medida. Nada se borra: se da de baja para no afectar el historial de artículos y movimientos.</p>
            </div>
          </div>

          <div class="row mt-2">
            <div class="col-12 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item"><a class="nav-link active" data-toggle="tab" href="#tab-categorias">Categorías</a></li>
                    <li class="nav-item"><a class="nav-link" data-toggle="tab" href="#tab-almacenes">Almacenes</a></li>
                    <li class="nav-item"><a class="nav-link" data-toggle="tab" href="#tab-proveedores">Proveedores</a></li>
                    <li class="nav-item"><a class="nav-link" data-toggle="tab" href="#tab-unidades">Unidades</a></li>
                  </ul>
                  <div class="tab-content pt-4">
                    <div class="tab-pane fade show active" id="tab-categorias">
                      <div class="d-flex justify-content-end mb-2">
                        <button type="button" class="btn btn-sm btn-primary btn-nuevo" data-tipo="categorias">
                          <i class="typcn typcn-plus mr-1"></i>Nueva categoría
                        </button>
                      </div>
                      <div class="table-responsive"><table class="table"><tbody id="tabla-categorias"><tr><td>Cargando...</td></tr></tbody></table></div>
                    </div>
                    <div class="tab-pane fade" id="tab-almacenes">
                      <div class="d-flex justify-content-end mb-2">
                        <button type="button" class="btn btn-sm btn-primary btn-nuevo" data-tipo="almacenes">
                          <i class="typcn typcn-plus mr-1"></i>Nuevo almacén
                        </button>
                      </div>
                      <div class="table-responsive"><table class="table"><tbody id="tabla-almacenes"><tr><td>Cargando...</td></tr></tbody></table></div>
                    </div>
                    <div class="tab-pane fade" id="tab-proveedores">
                      <div class="d-flex justify-content-end mb-2">
                        <button type="button" class="btn btn-sm btn-primary btn-nuevo" data-tipo="proveedores">
                          <i class="typcn typcn-plus mr-1"></i>Nuevo proveedor
                        </button>
                      </div>
                      <div class="table-responsive"><table class="table"><tbody id="tabla-proveedores"><tr><td>Cargando...</td></tr></tbody></table></div>
                    </div>
                    <div class="tab-pane fade" id="tab-unidades">
                      <div class="d-flex justify-content-end mb-2">
                        <button type="button" class="btn btn-sm btn-primary btn-nuevo" data-tipo="unidades">
                          <i class="typcn typcn-plus mr-1"></i>Nueva unidad
                        </button>
                      </div>
                      <div class="table-responsive"><table class="table"><tbody id="tabla-unidades"><tr><td>Cargando...</td></tr></tbody></table></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- content-wrapper ends -->
        <footer class="footer">
          <div class="d-sm-flex justify-content-center justify-content-sm-between">
            <span class="text-center text-sm-left d-block d-sm-inline-block">Mantenimiento — Panel interno</span>
          </div>
        </footer>
      </div>
      <!-- main-panel ends -->
    </div>
    <!-- page-body-wrapper ends -->
  </div>
  <!-- container-scroller -->

  <!-- ============================== Modal: alta / edición de catálogo ============================== -->
  <div class="modal fade" id="modalCatalogo" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <form id="formCatalogo">
          <div class="modal-header">
            <h5 class="modal-title" id="tituloModalCatalogo">Nuevo</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
          </div>
          <div class="modal-body">
            <div class="alert alert-danger d-none" id="errorCatalogo"></div>
            <div id="camposCatalogo"><!-- generado por JS según el tipo --></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="vendors/js/vendor.bundle.base.js"></script>
  <script src="js/off-canvas.js"></script>
  <script src="js/hoverable-collapse.js"></script>
  <script src="js/template.js"></script>
  <script src="js/mtto-config.js"></script>
  <script src="js/layout.js?v=2"></script>
  <script>Layout.inyectar();</script>

  <script src="js/auth.js"></script>
  <script>Auth.exigirSesion("mtto");</script>
  <script src="js/mtto-api.js"></script>
  <script src="js/mtto-catalogos.js"></script>
</body>
</html>
