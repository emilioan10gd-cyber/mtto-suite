<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catéter · Etiquetas de código de barras</title>
  <style>
    /* Misma hoja que etiquetas.html (MTTO): medidas en pulgadas para que el
       tamaño impreso sea real y no dependa del zoom del navegador. Cambia solo
       el alto de la etiqueta, porque aquí se imprimen dos renglones de texto
       (clave y nombre) en vez de uno. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f5f7;
      color: #1f2430;
    }

    .barra {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 20px;
      background: #1f2430; color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    .barra h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .barra .cuenta { font-size: 13px; opacity: .8; }
    .barra .crece { flex: 1; }
    .barra button {
      border: 0; border-radius: 4px; padding: 7px 16px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      background: #2a78d6; color: #fff;
    }
    .barra button.secundario { background: #454b5a; }
    .barra button:hover { filter: brightness(1.1); }

    .aviso { padding: 20px; font-size: 14px; }
    .aviso.error { color: #c0392b; }

    .hoja {
      width: 8.5in;
      margin: 16px auto;
      padding: 0.4in 0.3in;
      background: #fff;
      box-shadow: 0 1px 6px rgba(0,0,0,.15);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.12in;
      align-content: start;
    }

    .etiqueta {
      border: 1px dashed #c8ccd4;
      border-radius: 3px;
      padding: 6px 4px 4px;
      text-align: center;
      height: 1.3in;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .etiqueta .nombre {
      font-size: 8.5px; line-height: 1.15;
      max-height: 2.3em; overflow: hidden;
      margin-bottom: 3px; color: #333;
    }
    .etiqueta .referencia {
      font-size: 7.5px; color: #666; margin-top: 2px;
    }
    .etiqueta svg { display: block; }

    @media print {
      body { background: #fff; }
      .barra, .aviso { display: none !important; }
      .hoja {
        width: auto; margin: 0; box-shadow: none;
        padding: 0.25in;
      }
      .etiqueta { border-color: #e6e8ec; }
      @page { size: letter portrait; margin: 0.3in; }
    }
  </style>
</head>
<body>
  <div class="barra">
    <h1>Etiquetas — Clínica de Catéter</h1>
    <span class="cuenta" id="cuenta"></span>
    <span class="crece"></span>
    <button type="button" id="btnImprimir">Imprimir</button>
    <button type="button" class="secundario" onclick="window.close()">Cerrar</button>
  </div>

  <div class="aviso" id="aviso">Cargando artículos…</div>
  <div class="hoja" id="hoja"></div>

  <script src="js/mtto-config.js?v=14"></script>
  <script src="js/auth.js?v=14"></script>
  <script>Auth.exigirSesion("cateter");</script>
  <script src="js/cateter-api.js?v=17"></script>
  <script src="js/mtto-barcode.js?v=12"></script>
  <script>
  (function () {
    function escapa(t) {
      const d = document.createElement("div");
      d.textContent = t ?? "";
      return d.innerHTML;
    }

    async function obtenerArticulos() {
      const qp = new URLSearchParams(location.search);

      // Modo 1: una clave suelta, desde el botón de una fila del inventario.
      // La clave lleva puntos y va por query string, nunca en el path.
      const clave = qp.get("clave");
      if (clave) {
        const resultado = await CateterApi.inventario.listar({ q: clave, tamano: 100 });
        // listar() busca por texto, así que puede traer parecidas: se queda
        // solo con las que son exactamente esa clave (sus presentaciones).
        const exactas = resultado.datos.filter(a => a.clave === clave);
        return exactas.length ? exactas : resultado.datos;
      }

      // Modo 2: hoja completa, con los mismos filtros de la pantalla de
      // Inventario, para que lo impreso sea justo lo que se está viendo.
      const params = { pagina: 1, tamano: 500 };
      ["q", "categoria", "nivel", "alerta"].forEach(k => {
        const v = qp.get(k);
        if (v) params[k] = v;
      });
      const pagina = await CateterApi.inventario.listar(params);
      return pagina.datos;
    }

    async function iniciar() {
      const aviso = document.getElementById("aviso");
      const hoja = document.getElementById("hoja");
      try {
        const articulos = await obtenerArticulos();
        if (!articulos.length) {
          aviso.textContent = "No hay artículos que coincidan con el filtro.";
          return;
        }

        hoja.innerHTML = articulos.map(a => `
          <div class="etiqueta">
            <div class="nombre">${escapa(a.nombre)}</div>
            ${MttoBarcode.svg(a.clave, { moduloPx: 1.1, altoPx: 36, margenPx: 6 })}
            ${a.referencia ? `<div class="referencia">Ref. ${escapa(a.referencia)}</div>` : ""}
          </div>`).join("");

        aviso.style.display = "none";
        document.getElementById("cuenta").textContent =
          articulos.length + (articulos.length === 1 ? " etiqueta" : " etiquetas");
      } catch (err) {
        aviso.className = "aviso error";
        aviso.textContent = "No se pudieron cargar los artículos: " + err.message;
      }
    }

    document.getElementById("btnImprimir").addEventListener("click", () => window.print());
    document.addEventListener("DOMContentLoaded", iniciar);
    if (document.readyState !== "loading") iniciar();
  })();
  </script>
</body>
</html>
